{% set name = "flufl.enum" %}
{% set version = "6.1.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/flufl_enum-{{ version }}.tar.gz
  sha256: 1def2f98963d1c75732f46ea5b14e81cff7f3f6b55bc5ac951d2f955fdf6fc7f

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv

requirements:
  host:
    - python
    - pip
  run:
    - python

test:
  requires:
    - pip
  commands:
    - pip check
  imports:
    - flufl
    - flufl.enum
    - flufl.enum.docs
    - flufl.enum.tests

about:
  home: http://launchpad.net/flufl.enum
  license: LGPLv3+
  license_file: LICENSE
  summary: 'A Python enumeration package.'

extra:
  recipe-maintainers:
    - cehbrecht
