{% set name = "flufl.enum" %}
{% set version = "7.0.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/flufl_enum-{{ version }}.tar.gz
  sha256: 7669ca411d9ed2dcfd92464a602d32218abc653d93ffc836994936835f1ede26

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv

requirements:
  host:
    - python
    - pip
  run:
    - python

test:
  requires:
    - pip
  commands:
    - pip check
  imports:
    - flufl
    - flufl.enum
    - flufl.enum.docs
    - flufl.enum.tests

about:
  home: http://launchpad.net/flufl.enum
  license: LGPLv3+
  license_file: LICENSE
  summary: 'A Python enumeration package.'

extra:
  recipe-maintainers:
    - cehbrecht
